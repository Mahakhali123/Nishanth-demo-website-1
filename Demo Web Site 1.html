/* ============================================================
   FadeIn — scroll-triggered reveal (uses motion.create())
============================================================ */
const motionTagCache = new Map<string, any>();
const getMotionTag = (tag: string): any => {
  if (!motionTagCache.has(tag)) {
    const m = motion as any;
    motionTagCache.set(tag, typeof m.create === "function" ? m.create(tag) : m[tag]);
  }
  return motionTagCache.get(tag);
};

interface FadeInProps {
  children: ReactNode;
  delay?: number;
  duration?: number;
  x?: number;
  y?: number;
  className?: string;
  as?: string;
}

const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className, as = "div" }: FadeInProps) => {
  const Tag = getMotionTag(as);
  return (
    <Tag
      className={className}
      initial={{ opacity: 0, x, y }}
      whileInView={{ opacity: 1, x: 0, y: 0 }}
      viewport={{ once: true, margin: "50px", amount: 0 }}
      transition={{ delay, duration, ease: [0.25, 0.1, 0.25, 1] }}
    >
      {children}
    </Tag>
  );
};

/* ============================================================
   Magnet — mouse-following magnetic hover effect
============================================================ */
interface MagnetProps {
  children: ReactNode;
  padding?: number;
  strength?: number;
  activeTransition?: string;
  inactiveTransition?: string;
}

const Magnet = ({
  children,
  padding = 100,
  strength = 2,
  activeTransition = "transform 0.3s ease-out",
  inactiveTransition = "transform 0.6s ease-in-out",
}: MagnetProps) => {
  const ref = useRef<HTMLDivElement>(null);
  const [offset, setOffset] = useState({ x: 0, y: 0 });
  const [active, setActive] = useState(false);

  useEffect(() => {
    const handleMove = (e: MouseEvent) => {
      const el = ref.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const withinX = Math.abs(e.clientX - cx) < rect.width / 2 + padding;
      const withinY = Math.abs(e.clientY - cy) < rect.height / 2 + padding;
      if (withinX && withinY) {
        setActive(true);
        setOffset({ x: (e.clientX - cx) / strength, y: (e.clientY - cy) / strength });
      } else {
        setActive(false);
        setOffset({ x: 0, y: 0 });
      }
    };
    window.addEventListener("mousemove", handleMove);
    return () => window.removeEventListener("mousemove", handleMove);
  }, [padding, strength]);

  return (
    <div
      ref={ref}
      style={{
        transform: `translate3d(${offset.x}px, ${offset.y}px, 0)`,
        transition: active ? activeTransition : inactiveTransition,
        willChange: "transform",
      }}
    >
      {children}
    </div>
  );
};

/* ============================================================
   AnimatedText — character-by-character scroll reveal
============================================================ */
interface CharProps {
  char: string;
  index: number;
  total: number;
  progress: MotionValue<number>;
}

const Char = ({ char, index, total, progress }: CharProps) => {
  const opacity = useTransform(progress, [index / total, (index + 1) / total], [0.2, 1]);
  return (
    <span style={{ position: "relative", display: "inline-block" }}>
      <span style={{ visibility: "hidden" }}>{char}</span>
      <motion.span style={{ position: "absolute", left: 0, top: 0, opacity }}>{char}</motion.span>
    </span>
  );
};

const AnimatedText = ({ text, className, style }: { text: string; className?: string; style?: CSSProperties }) => {
  const ref = useRef<HTMLParagraphElement>(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ["start 0.8", "end 0.2"] });

  const words = text.split(" ");
  const total = text.replace(/ /g, "").length;
  let charIndex = 0;

  return (
    <p ref={ref} className={className} style={style}>
      {words.map((word, wi) => (
        <React.Fragment key={wi}>
          <span style={{ display: "inline-block" }}>
            {Array.from(word).map((ch, ci) => {
              const idx = charIndex++;
              return <Char key={ci} char={ch} index={idx} total={total} progress={scrollYProgress} />;
            })}
          </span>
          {wi < words.length - 1 ? " " : null}
        </React.Fragment>
      ))}
    </p>
  );
};

   2. Marquee Section — scroll-sheared rows of project gifs
============================================================ */
const MarqueeTile = ({ src }: { src: string }) => (
  <img
    src={src}
    alt=""
    aria-hidden="true"
    width={420}
    height={270}
    loading="lazy"
    decoding="async"
    className="w-[420px] h-[270px] max-w-none rounded-2xl object-cover shrink-0 bg-[#141414]"
  />
);

const MarqueeSection = () => {
  const sectionRef = useRef<HTMLElement>(null);
  const row1Ref = useRef<HTMLDivElement>(null);
  const row2Ref = useRef<HTMLDivElement>(null);

  useEffect(() => {
    const section = sectionRef.current;
    const row1 = row1Ref.current;
    const row2 = row2Ref.current;
    if (!section || !row1 || !row2) return;

    let raf = 0;
    const update = () => {
      raf = 0;
      const offset = (window.scrollY - section.offsetTop + window.innerHeight) * 0.3;
      row1.style.transform = `translateX(${offset - 200}px)`;
      row2.style.transform = `translateX(${-(offset - 200)}px)`;
    };
    const onScroll = () => {
      if (!raf) raf = requestAnimationFrame(update);
    };

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    update();

    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  const row1 = MARQUEE_GIFS.slice(0, 11);
  const row2 = MARQUEE_GIFS.slice(11);
  const triple = (items: string[]) => [...items, ...items, ...items];

  return (
    <section ref={sectionRef} className="bg-[#0C0C0C] pt-24 sm:pt-32 md:pt-40 pb-10">
      <div className="flex flex-col gap-3">
        <div className="w-full overflow-hidden">
          <div ref={row1Ref} className="flex gap-3 w-max" style={{ willChange: "transform", transform: "translateX(-200px)" }}>
            {triple(row1).map((src, i) => (
              <MarqueeTile key={i} src={src} />
            ))}
          </div>
        </div>
        <div className="w-full overflow-hidden">
          <div ref={row2Ref} className="flex gap-3 w-max" style={{ willChange: "transform", transform: "translateX(200px)" }}>
            {triple(row2).map((src, i) => (
              <MarqueeTile key={i} src={src} />
            ))}
          </div>
        </div>
      </div>
    </section>
  );
};

/* ============================================================
   5. Projects Section — sticky stacking cards
============================================================ */
interface ProjectCardProps {
  project: Project;
  index: number;
  total: number;
  progress: MotionValue<number>;
}

const ProjectCard = ({ project, index, total, progress }: ProjectCardProps) => {
  const targetScale = 1 - (total - 1 - index) * 0.03;
  const scale = useTransform(progress, [index / total, 1], [1, targetScale]);

  return (
    <motion.div
      style={{ scale, transformOrigin: "top", willChange: "transform" }}
      className="rounded-[40px] sm:rounded-[50px] md:rounded-[60px] border-2 border-[#D7E2EA] bg-[#0C0C0C] p-4 sm:p-6 md:p-8 overflow-hidden"
    >
      {/* Top row */}
      <div className="flex flex-wrap items-center justify-between gap-x-6 gap-y-4 mb-4 sm:mb-6 md:mb-8">
        <div className="flex items-center gap-4 sm:gap-6 md:gap-10">
          <span className="hero-heading font-black leading-none" style={{ fontSize: "clamp(3rem, 10vw, 140px)" }}>
            {project.num}
          </span>
          <div>
            <p className="uppercase tracking-widest text-[#D7E2EA] opacity-60 text-xs sm:text-sm font-light">
              {project.category}
            </p>
            <h3
              className="font-medium uppercase text-[#D7E2EA] leading-tight"
              style={{ fontSize: "clamp(1rem, 2.2vw, 2.1rem)" }}
            >
              {project.name}
            </h3>
          </div>
        </div>
        <LiveProjectButton href={project.col2} />
      </div>

      {/* Bottom row — 40 / 60 image grid */}
      <div className="flex gap-3 sm:gap-4">
        <div className="w-[40%] flex flex-col gap-3 sm:gap-4">
          <img
            src={project.col1[0]}

            loading="lazy"

            style={{ height: "clamp(130px, 16vw, 230px)" }}
          />
          <img
            src={project.col1[1]}
            alt={`${project.name} — detail 2`}
            loading="lazy"

    </motion.div>

};

<audio id="entry-sound" src="flutie8211-door-slamming-2-551015.mp3" preload="auto" playsinline autoplay></audio>

<script>
  (function () {
    var audio = document.getElementById("entry-sound");
    if (!audio) return;
    audio.volume = 1.0;
    audio.muted = false;
    var played = false;
    function playEntrySound() {
      if (played && !audio.paused) return;
      try {
        audio.currentTime = 0;
        var p = audio.play();
        if (p && typeof p.then === "function") {
          p.then(function () { played = true; }).catch(function () {});
        }
      } catch (err) {}
    }
    // Direct attempts on entry + reload
    try { playEntrySound(); } catch (e) {}
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", playEntrySound, { once: true });
    } else {
      playEntrySound();
    }
    window.addEventListener("load", playEntrySound);
    setTimeout(playEntrySound, 300);
    setTimeout(playEntrySound, 1000);
    // Silent fallback, no visible gate: first scroll/click/key plays it
    function onFirstInteract() { playEntrySound(); }
    window.addEventListener("pointerdown", onFirstInteract, { once: true });
    window.addEventListener("keydown", onFirstInteract, { once: true });
    window.addEventListener("touchstart", onFirstInteract, { once: true });
    window.addEventListener("wheel", onFirstInteract, { once: true });
  })();
</script>
